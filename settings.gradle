pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'customname'

include '26.2'
include '26.1.2'

project(':26.2').projectDir = file('versions/26.2')
project(':26.1.2').projectDir = file('versions/26.1.2')
